name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build FancyText.slnx -c Release
      - name: Engine tests
        run: dotnet run --project tests/FancyText.Core.Tests -c Release --no-build
